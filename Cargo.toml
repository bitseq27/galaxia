[workspace]
resolver = "2"
members = [
    "crates/galaxia-core",
    "crates/galaxia-render",
    "crates/galaxia-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"   # personal project, never distributed (D1)
publish = false

[workspace.dependencies]
# PINNED per PLAN Appendix B — do not upgrade mid-project without an ADR.
wgpu = "=30.0.1"
naga = "=30.0.1"
winit = "0.30.13"
raw-window-handle = "0.6.2"
egui = "0.37.0"
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
glam = { version = "0.34.1", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.9"
rand_xoshiro = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

galaxia-core = { path = "crates/galaxia-core" }
galaxia-render = { path = "crates/galaxia-render" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1          # keep line info for profiling

[profile.dev]
opt-level = 1      # faster skeleton runs while iterating

[profile.dev.package."*"]
opt-level = 2      # deps optimised even in dev — wgpu/egui are unusable at opt 0
