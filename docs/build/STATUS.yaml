# docs/build/STATUS.yaml
#
# THE RESUME FILE. Machine-readable current state of the build.
# REWRITTEN at the end of every session — even a session that achieved nothing.
# A stale STATUS.yaml is worse than none, because it is trusted.
#
# Specification: PLAN.md §16.3.2
# This is a TEMPLATE. Copy to docs/build/STATUS.yaml and fill in from session 001.

schema: 1
updated: YYYY-MM-DDThh:mm:ss+08:00   # local time with offset
session: 0
commit: ""                            # HEAD at end of session
iteration: 0                          # see PLAN.md §16.4
iteration_name: ""
branch: main

phase: prototype                      # prototype | W1..W8 | done
skeleton_running: false               # does `cargo run` open a window and render?
last_green_ci: ""                     # last commit where CI was fully green

# ── Demonstrably works ─────────────────────────────────────────────────────────
# Only list things VERIFIED this session or later by actually running them.
# Optimism here is the main cause of wasted resume sessions.
working: []
  # - "wgpu window + swapchain"
  # - "frame graph (N passes stubbed, M live)"

# ── Known broken ───────────────────────────────────────────────────────────────
# Anything a future session might mistakenly trust. Be brutally honest.
not_working: []
  # - "glare is a naive Gaussian, not the bicubic c/theta^2 pyramid (PLAN §7.4)"

# ── The single next action ─────────────────────────────────────────────────────
# Precise enough that a cold reader can start immediately. One action, not a list.
next_action: |
  <the specific next thing to do>

next_iteration: 0
next_iteration_scope: |
  <what the next iteration must deliver, and its measured gate>

# ── Blockers ───────────────────────────────────────────────────────────────────
# Anything that stops progress, with what is needed to unblock it.
blocked: []
  # - item: "Gaia TAP query throttled"
  #   since: 2026-11-02
  #   unblock: "switch to ARI Heidelberg mirror, or fall back to the Pleiades fixture"

# ── Latest measurements ────────────────────────────────────────────────────────
# Mirror the newest row per scene from docs/build/measurements.csv.
# Budgets are in PLAN.md §6.2 — a value over budget is a bug, not a statistic.
measurements_latest:
  dataset: ""                         # e.g. "T0-orion (Gaia DR3, 41.2M stars, 1.34 GB)"
  stars_visible_ceiling_60fps: 0
  star_raster_10M_1440p_ms: null      # budget 5.5
  volumetrics_ms: null                # budget 2.2
  glare_ms: null                      # budget 1.5
  fsr2_ms: null                       # budget 1.2
  frame_ms_orion_wide: null           # budget 13.0
  fps_orion_wide: 0
  peak_vram_gb: 0.0                   # ceiling 22
  resident_leaves: 0
  stream_mb_s: 0
  free_nvme_gb: 0                     # HARD LIMIT 200 — ETL refuses below 40

# ── Environment ────────────────────────────────────────────────────────────────
# Pin these. "It worked yesterday" is usually "the driver changed".
environment:
  gpu: "NVIDIA TITAN RTX 24GB"
  driver: ""
  wgpu: ""                            # PINNED — do not upgrade mid-project
  rust: ""
  os: ""
  ram_gb: 96
  threads: 32

# ── Architecture decision records ─────────────────────────────────────────────
# Every deviation from PLAN.md gets one page: context / decision / consequences.
# Numbered sequentially, never deleted, indexed in docs/adr/INDEX.md.
adrs: []
  # - "0001-frame-hierarchy"
  # - "0003-egui-for-prototype-ui"

# ── Data provenance ───────────────────────────────────────────────────────────
# Which catalogs, which versions, which access date. Regenerates CREDITS.md.
datasets:
  gaia: { release: DR3, epoch: 2016.0, rows: 0, accessed: "" }
  # hyg: { version: v3, rows: 0, accessed: "" }
  # messier: { rows: 110, accessed: "" }
